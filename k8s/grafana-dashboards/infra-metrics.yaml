apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-infra-metrics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  infra-metrics.json: |
    {
      "title": "DevOps Arena — Infrastructure",
      "uid": "infra-metrics",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace='devops-arena', container!=''}[5m])) by (pod)",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Pod Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace='devops-arena', container!=''}) by (pod)",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Pod Restarts",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace='devops-arena'}) by (pod)",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Node CPU Usage (%)",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 8 },
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)",
              "legendFormat": "{{ instance }}"
            }
          ]
        },
        {
          "id": 5,
          "title": "RDS Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "aws_rds_database_connections_average",
              "legendFormat": "DB Connections"
            }
          ]
        },
        {
          "id": 6,
          "title": "Istio Request Success Rate (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{destination_service_namespace='devops-arena', response_code!~'5..'}[5m])) / sum(rate(istio_requests_total{destination_service_namespace='devops-arena'}[5m])) * 100",
              "legendFormat": "Success Rate %"
            }
          ]
        }
      ]
    }
