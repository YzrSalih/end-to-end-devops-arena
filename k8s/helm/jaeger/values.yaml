# Jaeger: distributed tracing
# allInOne modu: dev için tek pod'da collector + query + UI
# Prod'da: collector + query ayrı, Elasticsearch backend

provisionDataStore:
  cassandra: false
  elasticsearch: false
  kafka: false

allInOne:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  extraEnv:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"    # OpenTelemetry protokolünü kabul et

storage:
  type: memory         # dev için in-memory; prod'da elasticsearch

agent:
  enabled: false       # OpenTelemetry Collector kullandığımız için devre dışı

collector:
  enabled: false       # allInOne içinde geliyor

query:
  enabled: false       # allInOne içinde geliyor

ingress:
  enabled: false       # Grafana üzerinden erişeceğiz (Jaeger datasource)
