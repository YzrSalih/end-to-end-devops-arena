apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-service-secret
  namespace: devops-arena
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: notification-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: devops-arena/notification-service
        property: RABBITMQ_URL
